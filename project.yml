name: HerrOber
options:
  bundleIdPrefix: de.dvld
  developmentLanguage: de
  deploymentTarget:
    iOS: "17.0"
targets:
  HerrOber:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Content
        type: folder
      - path: Fonts
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.dvld.herrober
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "3"
        DEVELOPMENT_TEAM: FQZ492F2YC
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Distribution"
        PROVISIONING_PROFILE_SPECIFIER: "de.dvld.herrober AppStore"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: "Herr Ober!"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleLocalizations: [de, en]
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        UIAppFonts:
          - Fonts/UnifrakturMaguntia-Book.ttf
          - Fonts/UnifrakturCook-Bold.ttf
          - Fonts/AtkinsonHyperlegible-Regular.ttf
          - Fonts/AtkinsonHyperlegible-Bold.ttf
  HerrOberTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: HerrOber
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: ""
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/HerrOber.app/HerrOber"
        BUNDLE_LOADER: "$(TEST_HOST)"
        PRODUCT_BUNDLE_IDENTIFIER: de.dvld.herrober.tests
  HerrOberUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: HerrOber
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: ""
        PRODUCT_BUNDLE_IDENTIFIER: de.dvld.herrober.uitests
schemes:
  HerrOber:
    build:
      targets:
        HerrOber: all
        HerrOberTests: [test]
        HerrOberUITests: [test]
    test:
      targets: [HerrOberTests, HerrOberUITests]
